dialog.about.text=L'essaim classique venu de l'espace : les insectes arrivent en courbes, prennent leur place dans la formation et plongent sur votre chasseur.
dialog.about.rules=Abeilles, papillons et chefs rapportent plus en vol que dans la formation ; un chef encaisse deux tirs. Deux tirs volent à la fois. Un niveau sur trois est un niveau bonus : personne ne tire, personne ne reste, et toucher les quarante rapporte 10 000 points de plus. Un chasseur de plus à 20 000 points, puis tous les 60 000. P met en pause, F11 passe en plein écran et en revient.
