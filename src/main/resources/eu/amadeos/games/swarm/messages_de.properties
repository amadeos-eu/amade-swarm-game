dialog.about.text=Der klassische Schwarm aus dem All: Die Insekten fliegen in Bögen heran, nehmen ihre Plätze in der Formation ein und stürzen sich auf Ihren Jäger.
dialog.about.rules=Bienen, Schmetterlinge und Bosse bringen im Flug mehr Punkte als in der Formation; ein Boss verträgt zwei Treffer. Zwei Schüsse fliegen gleichzeitig. Jede dritte Stufe ist eine Bonusstufe: Niemand schießt, niemand bleibt, und wer alle vierzig trifft, bekommt 10.000 Punkte dazu. Ein Jäger mehr bei 20.000 Punkten, dann alle 60.000. P hält an, F11 schaltet ins Vollbild und zurück.
