dialog.about.text=The classic swarm from space: the insects swoop in, take their places in a formation and dive at your fighter.
dialog.about.rules=Bees, butterflies and bosses are worth more when you hit them in flight than in the formation; a boss takes two hits. Two shots fly at a time. Every third stage is a challenge: nobody shoots, nobody stays, and hitting all forty brings a bonus of 10,000. An extra fighter at 20,000 points, then every 60,000. P pauses, F11 switches to full screen and back.
