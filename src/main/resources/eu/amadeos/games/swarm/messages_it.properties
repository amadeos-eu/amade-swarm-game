dialog.about.text=Il classico sciame dallo spazio: gli insetti arrivano in curva, prendono posto nella formazione e si lanciano sul tuo caccia.
dialog.about.rules=Api, farfalle e capi valgono di più in volo che nella formazione; un capo regge due colpi. Volano due colpi alla volta. Un livello su tre è un livello bonus: nessuno spara, nessuno resta, e colpirli tutti e quaranta vale 10.000 punti in più. Un caccia in più a 20.000 punti, poi ogni 60.000. P mette in pausa, F11 passa allo schermo intero e torna indietro.
